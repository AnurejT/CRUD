{% extends 'master.html' %}

{% block title %} Flask CRUD {% endblock %}

{% block body %}  
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-black fs-3" href="#">CRUD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active fw-bold text-primary{% endif %}" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/create' %}active fw-bold text-primary{% endif %}" href="/create">Add Student</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/view' %}active fw-bold text-primary{% endif %}" href="/view">View List</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
{% endblock %}
