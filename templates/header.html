{% extends 'master.html' %}

{% block title %} Flask CRUD {% endblock %}

{% block body %}  
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-black fs-3" href="#">CRUD</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active text-primary fw-bold{% endif %}" 
                        href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/create' %}active text-primary fw-bold{% endif %}" 
                        href="/create">Add Student</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/view' %}active text-primary fw-bold{% endif %}" 
                        href="/view">View List</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto" style="margin-right: 15px;">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/login' %}active text-primary fw-bold{% endif %}" 
                        href="/login">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>


<style>
    .navbar-nav .nav-item .nav-link {
        position: relative;
        display: inline-block;
        transition: transform 0.3s ease-in-out, color 0.3s ease-in-out;
        padding: 10px 15px;
    }

    .navbar-nav .nav-item .nav-link:hover {
        transform: translateY(-3px);
        color: #1e6a94 !important;  
        font-weight: bold;
    }
</style>

{% endblock %}
