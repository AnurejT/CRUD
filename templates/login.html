{% extends 'master.html' %}
{% block title %}Login — StudentHub{% endblock %}

{% block body %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center;
            background: radial-gradient(ellipse at 30% 50%, rgba(108,99,255,0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 20%, rgba(167,139,250,0.08) 0%, transparent 50%),
                        var(--bg);">

    <div style="width:100%; max-width:400px; padding:1rem;">

        <!-- Logo -->
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="display:inline-flex;align-items:center;justify-content:center;
                        width:64px;height:64px;border-radius:16px;
                        background:linear-gradient(135deg,var(--accent),var(--accent2));
                        font-size:1.6rem;color:#fff;margin-bottom:1rem;
                        box-shadow:0 8px 32px rgba(108,99,255,0.35);">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1 style="font-size:1.6rem;font-weight:800;margin:0;">StudentHub</h1>
            <p style="color:var(--muted);font-size:0.875rem;margin-top:4px;">Sign in to manage students</p>
        </div>

        <!-- Card -->
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}" novalidate>
                    <div class="form-group" style="margin-bottom:1.2rem;">
                        <label for="studentid">Username</label>
                        <div style="position:relative;">
                            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);">
                                <i class="fas fa-user"></i>
                            </span>
                            <input class="input" type="text" id="studentid" name="studentid"
                                   placeholder="Enter your username" required autocomplete="username"
                                   style="padding-left:38px;">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label for="login-password">Password</label>
                        <div style="position:relative;">
                            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input class="input" type="password" id="login-password" name="password"
                                   placeholder="Enter your password" required autocomplete="current-password"
                                   style="padding-left:38px; padding-right:42px;">
                            <button type="button" onclick="togglePass('login-password', this)"
                                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                                           background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
                        <i class="fas fa-right-to-bracket"></i> Sign In
                    </button>
                </form>

                <div style="margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid var(--border);
                            text-align:center;font-size:0.78rem;color:var(--muted);">
                    Demo credentials: <code style="color:var(--accent2);">anurej</code> / <code style="color:var(--accent2);">123</code>
                </div>
            </div>
        </div>

        <p style="text-align:center;color:var(--muted);font-size:0.75rem;margin-top:1.5rem;">
            © 2025 StudentHub. All rights reserved.
        </p>
    </div>
</div>

<script>
function togglePass(id, btn) {
    const inp = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.classList.replace('fa-eye','fa-eye-slash');
    } else {
        inp.type = 'password';
        icon.classList.replace('fa-eye-slash','fa-eye');
    }
}

// Show loading state only AFTER the form begins submitting
const loginForm = document.getElementById('login-btn').closest('form');
const loginBtn  = document.getElementById('login-btn');
loginForm.addEventListener('submit', function() {
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In…';
    loginBtn.disabled = true;
});
</script>
{% endblock %}
