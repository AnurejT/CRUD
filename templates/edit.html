{% extends 'master.html' %}
{% include 'header.html' %}

{% block title%} Add Student {% endblock %}

{% block body %}
<div class = "container">
    <form action="" method="post">
        <table class="table">
            <tr>
                <td>First Name</td>
                <td><input type="text" name="first_name" class="form-control" value="{{student.first_name}}"></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" name="second_name" class="form-control" value="{{student.last_name}}"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="email" class="form-control" value="{{student.email}}"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="password" class="form-control" value="{{student.password}}"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                Male : <input type="radio" name="gender" value="male"
                {% if student.gender == 'male' %}
                        checked
                {% endif %}
                />
                Female : <input type="radio" name="gender" value="female"
                {% if student.gender == 'female' %}
                        checked
                {% endif %}>
                Other : <input type="radio" name="gender" value="other"
                {% if student.gender == 'other' %}
                        checked
                {% endif %}
                />
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                Cricket : <input type="checkbox" name="hobbies" value="cricket"
                {% if 'cricket' in student.hobbies %}
                        checked
                {% endif %}
                />
                Movies : <input type="checkbox" name="hobbies" value="movies"
                {% if 'movies' in student.hobbies %}
                        checked
                {% endif %}>
                Tv : <input type="checkbox" name="hobbies" value="tv"
                {% if 'tv' in student.hobbies %}
                        checked
                {% endif %}
                />
                </td>
            </tr>
            <tr>
                <td>Country</td>
                <td>
                    <select name="country" class="form-control">
                        <option value="INDIA"
                        {% if 'INDIA' in student.country %}
                                selected
                        {% endif %}        
                        >INDIA</option>
                        <option value="AMERICA"
                        {% if 'AMERICA' in student.country %}
                                selected
                        {% endif %}  
                        >AMERICA</option>
                        <option value="IRELAND"
                        {% if 'IRELAND' in student.country %}
                                selected
                        {% endif %}   
                        >IRELAND</option>
                        <option value="UK"
                        {% if 'UK' in student.country %}
                                selected
                        {% endif %}   
                        >UK</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" name="submit" value="submit" class="btn btn-warning">
                </td>
            </tr>
        </table>
    </form>

</div>

{% endblock %}
